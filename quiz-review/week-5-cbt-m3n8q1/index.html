<style>
  :root{
    --bg:#FFFFFF; --surface:#F8F5F5; --ink:#1A1A1A; --muted:#5B5B5B; --line:#E6DEDE;
    --accent:#841617; --accentDeep:#5C0F10; --accentSoft:#F5ECEC; --accentLine:#E8C8C8;
    --heroMuted:#6B4040;
    --good:#2E7D5B; --goodSoft:#E8F4EE; --goodLine:#BFE3D2;
    --bad:#841617;  --badSoft:#F5ECEC;  --badLine:#E8C8C8;
    --sans:'Hanken Grotesk',Arial,Helvetica,system-ui,sans-serif;
    --maxw:820px;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased;}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:24px;padding-bottom:56px;}
  a{color:var(--accentDeep);}

  /* ---------- hero ---------- */

  .toolhero{display:flex;align-items:center;gap:16px;background:var(--accentSoft);
    border:1px solid var(--accentLine);border-radius:12px;box-shadow:inset 4px 0 0 var(--accent);
    padding:18px 22px 18px 24px;margin-bottom:20px;}
  .toolhero .ico{width:52px;height:52px;border-radius:12px;background:#fff;
    border:1px solid var(--accentLine);display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;color:var(--accentDeep);}
  .toolhero .ico svg{width:26px;height:26px;display:block;}
  .toolhero .brand{margin:0;font-weight:700;font-size:22px;letter-spacing:-0.4px;color:var(--ink);line-height:1.1;}
  .toolhero .brand .bot{color:var(--accent);}
  .toolhero .tagline{color:var(--heroMuted);font-size:13.5px;margin-top:3px;}


  /* ---------- sticky progress ---------- */

  .qbar{position:sticky;top:0;z-index:10;background:var(--bg);
    display:flex;align-items:center;gap:12px;
    padding:14px 0 13px;margin:22px 0 18px;border-bottom:1px solid var(--line);}
  .qtrack{flex:1;height:7px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);overflow:hidden;}
  .qprog{height:100%;background:var(--accent);width:0;transition:width .25s ease;}
  .qcount{font-size:12.5px;color:var(--muted);font-weight:700;flex:0 0 auto;}

  /* ---------- questions ---------- */

  .qcard{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:22px;margin-bottom:14px;}

  .qnum{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
    color:var(--muted);margin:0 0 10px;}

  .stem{font-size:16px;font-weight:700;line-height:1.5;margin:0 0 16px;white-space:pre-line;}
  .hint{font-size:12.5px;color:var(--muted);margin:-8px 0 12px;}

  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:12px 14px;font-family:var(--sans);font-size:15px;color:var(--ink);
    cursor:pointer;transition:border-color .13s,background .13s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:focus-visible{outline:3px solid var(--accentDeep);outline-offset:2px;}
  .opt:disabled{cursor:default;}
  .opt .ltr{font-weight:700;color:var(--accent);flex:0 0 auto;width:18px;}

  .opt.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .opt.correct{background:var(--goodSoft);border-color:var(--good);
    box-shadow:inset 0 0 0 1px var(--good);font-weight:700;}
  .opt.correct .ltr{color:var(--good);}
  .opt.correct::after{content:"\2713";margin-left:auto;padding-left:12px;
    color:var(--good);font-weight:700;flex:0 0 auto;}
  .opt.wrong{background:var(--badSoft);border-color:var(--bad);
    box-shadow:inset 0 0 0 1px var(--bad);}
  .opt.wrong .ltr{color:var(--bad);}
  .opt.wrong::after{content:"\2715";margin-left:auto;padding-left:12px;
    color:var(--bad);font-weight:700;flex:0 0 auto;}
  .opt.dim{opacity:.45;}

  .check{margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:9px 16px;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;}
  .check:hover:not(:disabled){background:var(--accentDeep);}
  .check:disabled{opacity:.45;cursor:default;}

  /* ---------- rationale ---------- */

  .why{display:none;margin-top:16px;background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:9px;padding:16px 18px;font-size:14.5px;line-height:1.6;}
  .why.show{display:block;}
  .why.ok{border-left-color:var(--good);}
  .why.no{border-left-color:var(--bad);}

  .verdict{display:block;font-weight:700;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;margin-bottom:8px;}
  .verdict.ok{color:var(--good);}
  .verdict.no{color:var(--bad);}

  .source{display:block;margin-top:14px;padding-top:12px;
    border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--muted);}
  .source b{font-size:11px;letter-spacing:1px;text-transform:uppercase;
    font-weight:700;color:var(--accentDeep);margin-right:8px;}

  /* ---------- result ---------- */

  .result{display:none;margin-top:22px;background:var(--accentSoft);
    border:1px solid var(--accentLine);border-radius:12px;padding:26px;text-align:center;}
  .result.show{display:block;}
  .score{font-size:38px;font-weight:800;line-height:1;margin:0 0 8px;letter-spacing:-1px;}
  .score-note{margin:0 0 20px;font-size:15px;color:var(--muted);}

  .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:12px 22px;font-size:15px;font-weight:700;font-family:var(--sans);
    cursor:pointer;transition:background .15s;}
  .btn:hover{background:var(--accentDeep);}
  .btn:focus-visible{outline:3px solid var(--accentDeep);outline-offset:3px;}

  /* ---------- references + footer ---------- */

  .seclabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
    color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px;margin:34px 0 12px;}
  .refs{font-size:13.5px;line-height:1.65;color:var(--muted);}
  .refs p{margin:0 0 7px;}

  .foot{color:var(--muted);font-size:12.5px;margin-top:40px;
    border-top:1px solid var(--line);padding-top:16px;}
  .foot a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  .foot a:hover{color:var(--accentDeep);}
  .foot-legal{margin-top:9px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<script>
(function () {
  "use strict";

  var QUESTIONS = [
    {
      "stem": "A client says that when her roommate leaves dishes in the sink for days, she either says nothing for a week or ends up yelling. In session she can describe exactly what a calm, direct request would sound like, but says that in the moment she \"freezes up and can't get it out.\" Which type of skill deficit best fits?",
      "options": [
        "Acquisition deficit",
        "Performance deficit",
        "Fluency deficit"
      ],
      "answer": 1,
      "why": "She knows the skill but is inhibited from using it by emotional or cognitive factors, which is a performance deficit. An acquisition deficit means she never learned the skill; a fluency deficit means she uses it but awkwardly (Tolin, p. 37).",
      "source": ""
    },
    {
      "stem": "A father reports that when he asks his 14-year-old to start homework, the teen argues and slams doors until the father says, \"Fine, forget it.\" The arguing has become more frequent over the past year. Which process best explains the increase?",
      "options": [
        "Positive reinforcement, since the arguing gets the father's attention",
        "Negative reinforcement, since the arguing removes the homework demand",
        "Punishment, since the father's frustration follows the arguing"
      ],
      "answer": 1,
      "why": "The behavior is followed by the removal of something aversive and increases as a result, which is escape, or negative reinforcement. Attention may also play a part, but the clearest contingency here is the demand going away (Tolin, pp. 28-29).",
      "source": ""
    },
    {
      "stem": "A mother says, \"I ground him every single time he skips school, and it hasn't changed a thing.\" Which response best reflects the operant conditioning perspective on consequences and behavior?",
      "options": [
        "\"It sounds like you need to be more consistent so he knows you mean it.\"",
        "\"Grounding may not be severe enough. What consequence would he actually feel?\"",
        "\"If skipping hasn't gone down, grounding isn't working as a punisher. Let's explore what reinforces his behavior.\""
      ],
      "answer": 2,
      "why": "A consequence counts as a punisher only if it actually reduces the behavior. When it doesn't, the behavior is usually under the control of more immediate reinforcers, and adding aversive consequences without addressing those is a losing battle (Tolin, p. 30).",
      "source": ""
    },
    {
      "stem": "A couple agrees to stop responding to their 6-year-old's whining and to give attention only when she asks in a normal voice. Four days in, they report the whining is worse than ever and ask whether they should go back to the old approach. What should the therapist do next?",
      "options": [
        "Explain that a temporary increase is expected when reinforcement stops, and encourage them to hold the plan",
        "Recommend adding a mild punishment for whining, since ignoring it alone has not worked",
        "Agree to pause the plan, since a worse response suggests the conceptualization was wrong"
      ],
      "answer": 0,
      "why": "When a previously reinforced behavior stops paying off, it typically spikes before it declines. This extinction burst is a sign the plan is working, and giving in now reinforces the whining at its new, higher level (Tolin, p. 33).",
      "source": ""
    },
    {
      "stem": "A client stopped driving after a panic attack on the highway six months ago. He now says, \"Not driving is the only reason I haven't had another one.\" From a CBT perspective, what is most likely maintaining the problem?",
      "options": [
        "A core belief about needing to be in control",
        "Avoidance that prevents him from learning the feared outcome doesn't occur",
        "Insufficient use of relaxation skills"
      ],
      "answer": 1,
      "why": "Avoidance is negatively reinforced by relief and blocks corrective learning, so the belief that driving is dangerous stays intact. The fact that nothing bad happened seems to prove the avoidance was necessary (Tolin, pp. 33-34, 43).",
      "source": ""
    },
    {
      "stem": "A client experiencing sad mood spends evenings alone watching television, avoids answering calls from friends, and has dropped hobbies he previously enjoyed. From a CBT perspective, what factor might contribute to maintaining his depressed mood?",
      "options": [
        "Unprocessed grief from a past loss",
        "Reduced reinforcement from social and pleasurable activities",
        "Overidentification with being in a depressive state"
      ],
      "answer": 1,
      "why": "In the context of CBT, the maintenance of depressed mood can be attributed to reduced reinforcement because the client's withdrawal from social interactions and enjoyable activities eliminates sources of positive reinforcement, leading to further sadness. This creates a cycle where the depressed mood reduces motivation for engagement, and without positive experiences, the mood remains low.",
      "source": ""
    },
    {
      "stem": "At a work event, Jane told a story to a small group of colleagues. Three of them laughed and asked follow-up questions. One glanced at their phone partway through. On the drive home, Jane replayed the moment in her head and decided the story had fallen flat and that she should stop trying to be funny at work. Which cognitive process best accounts for her conclusion?",
      "options": [
        "Attentional bias",
        "Memory bias",
        "Overgeneralization"
      ],
      "answer": 0,
      "why": "Attentional bias refers to the tendency to focus on negative or fear-related cues while ignoring positive or neutral ones. Memory bias would affect what she recalls later; overgeneralization involves making broad, inaccurate conclusions (Tolin, pp. 56-57).",
      "source": ""
    },
    {
      "stem": "A client tells you she is certain she bombed a job interview. You ask what went wrong. \"Nothing I can point to. I've felt sick since I walked out. That's how I know.\" Which cognitive distortion is most evident?",
      "options": [
        "Mind reading",
        "Emotional reasoning",
        "Personalizing"
      ],
      "answer": 1,
      "why": "She treats a physical feeling as proof of an external fact. Mind reading would rest on inferring specific thoughts from another person; the only evidence offered here is the feeling itself (Tolin, pp. 65-66).",
      "source": ""
    },
    {
      "stem": "Over several sessions, a client with depression has made the following statements. Which best reflects an intermediate belief?",
      "options": [
        "\"My manager didn't say good morning. I've done something wrong.\"",
        "\"If I ask anyone for help, they'll realize I can't handle my job.\"",
        "\"I'm basically incompetent.\""
      ],
      "answer": 1,
      "why": "Intermediate beliefs are the attitudes, rules, and assumptions that sit between interpretations and core beliefs. The if-then assumption is intermediate; a is a situation-specific interpretation and c is a core belief about the self (Tolin, pp. 67-69).",
      "source": ""
    },
    {
      "stem": "A client who was in a car accident says she has been \"trying really hard not to think about it,\" and that the images are now showing up more often. Which response is the best next step?",
      "options": [
        "\"Let's build a stronger distraction plan so you have something ready when the images start.\"",
        "\"Before we get into the images, walk me through what happened that day.\"",
        "\"Trying to push a thought away tends to make it come back more often. The pushing itself may be what we need to work on.\""
      ],
      "answer": 2,
      "why": "Thought suppression produces rebound, and the reading treats it as a learned avoidance strategy to target directly. Option a is more suppression. Option b goes to the event itself and skips the maintaining process she just described (Tolin, pp. 82-83).",
      "source": ""
    },
    {
      "stem": "A few months after the end of a long relationship, a client reports she has been replaying the breakup most nights for the past month and hasn't been sleeping well. She describes her thoughts as \"trying to figure out what I did wrong so it doesn't happen again.\" She hasn't reached any conclusions. Which response is best?",
      "options": [
        "\"That kind of reflection can be useful. What have you learned so far?\"",
        "\"Has all that thinking led to any decisions or changes, or does it mostly go over the same ground?\"",
        "\"Try to stop thinking about it. Dwelling on it is only making you feel worse.\""
      ],
      "answer": 1,
      "why": "Rumination and problem solving can feel identical from the inside. The distinguishing feature is whether the thinking repeats and grows more negative or produces solutions, so the therapist checks for that before deciding how to intervene. Telling her to stop invites thought suppression (Tolin, pp. 78-79).",
      "source": ""
    },
    {
      "stem": "A new mother reports repeated intrusive images of dropping her baby down the stairs. She is horrified by them and asks, \"Does this mean I secretly want to hurt him?\" Which response best reflects the concept of managing intrusive thoughts?",
      "options": [
        "\"Unwanted images like this are very common, including in people who would never act on them. The part we need to look at is how you're responding to them.\"",
        "\"Images like that suggest you may be more at risk than you realize, so let's focus on keeping the baby safe.\"",
        "\"Thoughts like these usually point to something unresolved. What was your own early childhood like?\""
      ],
      "answer": 0,
      "why": "Intrusions are ordinary and are not themselves what maintains the problem; the person's interpretation of and response to the intrusion is. Response b endorses thought-action fusion, and c treats the intrusion as a symbol rather than an event to be responded to (Tolin, pp. 59-60).",
      "source": ""
    },
    {
      "stem": "A client says that after a year of daily conflict with her supervisor, she now feels her chest tighten and her jaw clench as soon as she pulls into the office parking lot, before anything has happened. Which process best explains her reaction?",
      "options": [
        "Emotional reasoning",
        "Classical conditioning",
        "Negative reinforcement"
      ],
      "answer": 1,
      "why": "The parking lot has been paired repeatedly with anger and tension and now elicits the response on its own, making it a conditioned stimulus. Negative reinforcement concerns behavior that removes something aversive; emotional reasoning is a distortion in interpretation (Tolin, pp. 94-95).",
      "source": ""
    },
    {
      "stem": "A client seeks treatment for depressed mood. The therapist's conceptualization identifies inactivity and self-critical thinking as maintaining the mood, and this mood is causing her to miss work. The therapist decides to begin by scheduling daily activities. What type of target has the therapist chosen?",
      "options": [
        "A mechanism",
        "A symptom",
        "A functional outcome"
      ],
      "answer": 0,
      "why": "Inactivity and self-critical thinking are mechanisms because they maintain the depressed mood. The mood itself is the symptom, while missing work represents the functional outcome (Tolin, p. 103).",
      "source": ""
    },
    {
      "stem": "A client says she felt down all day after a coworker walked past her without saying hello. Later that same day she received a compliment from another colleague about her work, but this didn't lift her mood. Which feature best indicates the emotion has become maladaptive?",
      "options": [
        "The emotion was triggered by a common social event",
        "The emotion is disproportionate to events and doesn't improve with positive experiences",
        "The emotion persisted for the rest of the day"
      ],
      "answer": 1,
      "why": "The reading defines maladaptive emotion by proportion and flexibility: intensity that doesn't fit the situation, and failure to change when circumstances do. Duration alone isn't the criterion (Tolin, pp. 89-90).",
      "source": ""
    }
  ];

  var LETTERS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

  var quiz       = document.getElementById('quiz');
  var counter    = document.getElementById('counter');
  var meterFill  = document.getElementById('meterFill');
  var scoreLive  = document.getElementById('scoreLive');
  var result     = document.getElementById('result');
  var finalScore = document.getElementById('finalScore');
  var finalNote  = document.getElementById('finalNote');
  var restart    = document.getElementById('restart');

  var answered = 0, correct = 0;

  function answersOf(q) { return Array.isArray(q.answer) ? q.answer : [q.answer]; }

  function build() {
    quiz.innerHTML = '';
    answered = 0;
    correct = 0;
    result.classList.remove('show');
    updateStatus();

    QUESTIONS.forEach(function (q, qi) {
      var multi = Array.isArray(q.answer);
      var block = document.createElement('section');
      block.className = 'qcard';

      var num = document.createElement('p');
      num.className = 'qnum';
      num.textContent = 'Question ' + (qi + 1);

      var stem = document.createElement('p');
      stem.className = 'stem';
      stem.textContent = q.stem;

      var opts = document.createElement('div');
      opts.className = 'opts';

      var why = document.createElement('div');
      why.className = 'why';
      why.setAttribute('role', 'status');

      q.options.forEach(function (text, oi) {
        var btn = document.createElement('button');
        btn.className = 'opt';
        btn.type = 'button';

        var letter = document.createElement('span');
        letter.className = 'ltr';
        letter.textContent = LETTERS[oi];

        var label = document.createElement('span');
        label.textContent = text;

        btn.appendChild(letter);
        btn.appendChild(label);
        btn.addEventListener('click', function () {
          if (multi) { if (!btn.disabled) btn.classList.toggle('picked'); }
          else choose(q, [oi], opts, why);
        });
        opts.appendChild(btn);
      });

      block.appendChild(num);
      block.appendChild(stem);
      if (multi) {
        var hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = 'Select all that apply, then check.';
        block.appendChild(hint);
      }
      block.appendChild(opts);
      if (multi) {
        var check = document.createElement('button');
        check.className = 'check';
        check.type = 'button';
        check.textContent = 'Check answer';
        check.addEventListener('click', function () {
          var picks = [];
          var buttons = opts.querySelectorAll('.opt');
          for (var i = 0; i < buttons.length; i++) if (buttons[i].classList.contains('picked')) picks.push(i);
          if (!picks.length) return;
          check.disabled = true;
          choose(q, picks, opts, why);
        });
        block.appendChild(check);
      }
      block.appendChild(why);
      quiz.appendChild(block);
    });
  }

  function choose(q, picks, opts, why) {
    var buttons = opts.querySelectorAll('.opt');
    if (buttons[0].disabled) return;

    var answers = answersOf(q);
    var right = picks.length === answers.length && picks.every(function (p) { return answers.indexOf(p) >= 0; });
    answered++;
    if (right) correct++;

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = true;
      buttons[i].classList.remove('picked');
      if (answers.indexOf(i) >= 0)    buttons[i].classList.add('correct');
      else if (picks.indexOf(i) >= 0) buttons[i].classList.add('wrong');
      else                            buttons[i].classList.add('dim');
    }

    var verdict = document.createElement('span');
    verdict.className = 'verdict ' + (right ? 'ok' : 'no');
    var letters = answers.map(function (a) { return LETTERS[a]; });
    verdict.textContent = right ? 'Correct'
      : (letters.length > 1 ? 'The answers are ' + letters.join(' and ') : 'The answer is ' + letters[0]);

    why.className = 'why ' + (right ? 'ok' : 'no');
    why.innerHTML = '';
    why.appendChild(verdict);

    if (q.why) {
      var body = document.createElement('span');
      body.textContent = q.why;
      why.appendChild(body);
    }

    if (q.source) {
      var src = document.createElement('span');
      src.className = 'source';
      var srcLabel = document.createElement('b');
      srcLabel.textContent = 'Where to find it';
      var srcBody = document.createElement('span');
      srcBody.textContent = q.source;
      src.appendChild(srcLabel);
      src.appendChild(srcBody);
      why.appendChild(src);
    }

    why.classList.add('show');

    updateStatus();
    if (answered === QUESTIONS.length) finish();
  }

  function updateStatus() {
    counter.textContent = answered + ' of ' + QUESTIONS.length + ' answered';
    scoreLive.textContent = correct + ' correct';
    meterFill.style.width = (answered / QUESTIONS.length * 100) + '%';
  }

  function finish() {
    finalScore.textContent = correct + ' / ' + QUESTIONS.length;
    var pct = correct / QUESTIONS.length;
    finalNote.textContent = pct === 1
      ? 'All fifteen. Bring your questions to class anyway.'
      : pct >= 0.8
        ? 'Solid. Look back at the ones you missed before class.'
        : pct >= 0.5
          ? 'Worth a second pass through the readings on the items you missed.'
          : 'Read back through the rationales and the cited sections, then take it again.';
    result.classList.add('show');
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  restart.addEventListener('click', function () {
    build();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  build();
})();
</script>

</body>
</html>
