<script>
(function () {
  "use strict";

  var QUESTIONS = [
    {
      "stem": "A nurse with insomnia goes to bed around 10 p.m. and often lies awake for an hour or more. To pass the time, she reads or listens to podcasts in bed, hoping she will get drowsy. Applying stimulus control, which recommendation is BEST?",
      "options": [
        "\"If you're still awake after about 20 minutes, get up and do something quiet in another room, then come back to bed when you feel sleepy.\"",
        "\"Try a calming audiobook in bed each night to help you drift off.\"",
        "\"Cut out caffeine after noon and keep your bedroom cool and dark.\""
      ],
      "answer": 0,
      "why": "Stimulus control rebuilds the link between the bed and sleep, so wakeful activities like bills and news belong somewhere else. Stopping earlier still keeps the bed tied to work and alertness, and daytime naps weaken sleep drive at night. (Tolin, pp. 196 to 197)",
      "source": ""
    },
    {
      "stem": "A client working on problem drinking says she goes to the same bar with coworkers every Friday after work, and \"one drink always turns into six.\" These coworkers are her main social outlet. Using situation selection, which plan BEST fits?",
      "options": [
        "Advise her to look for a new job so she is no longer around these coworkers",
        "Help her plan to order only soda when she goes to the bar with her coworkers",
        "Explore skipping the Friday bar outings for now and seeing coworkers in other settings"
      ],
      "answer": 2,
      "why": "Situation selection means avoiding the settings that cue the problem behavior. The bar is a strong cue for heavy drinking, so stepping away from it for now lowers her exposure and still protects her social connections. Quitting her job goes far beyond what is needed, and ordering soda at the bar keeps her in the high risk setting. (Tolin, pp. 190 to 191)",
      "source": ""
    },
    {
      "stem": "A college student eats chips and candy throughout the day at her desk while studying, in the car between classes, and in bed while watching videos. By evening she often feels regret about her eating choices. Which intervention BEST applies narrowing?",
      "options": [
        "Keep a food log for a month before making any changes",
        "Eat only at set meal times at the kitchen table, doing nothing else while eating",
        "Practice a relaxation exercise whenever she feels the urge to snack"
      ],
      "answer": 1,
      "why": "Narrowing limits when and where the behavior happens, which cuts the link between eating and cues like studying, driving, and videos. A food log delays change, and relaxation does not address the many settings that cue snacking. (Tolin, p. 197)",
      "source": ""
    },
    {
      "stem": "Parents of a 4 year old decided together to stop buying candy when he whines at the checkout line. For the past week, his whining has become louder and longer. His dad asks whether he should just buy the candy to stop the embarrassing scenes. Using extinction principles, what should a social worker advise?",
      "options": [
        "\"Yes. The plan is making things worse, so it's time to stop ignoring the whining.\"",
        "\"Stay consistent with the plan. This increase is an expected part of extinction before the whining decreases.\"",
        "\"Add a time out each time he whines so the plan works faster.\""
      ],
      "answer": 1,
      "why": "Louder and longer whining is an extinction burst. If an adult gives in during the burst, the child learns that more intense whining pays off, so everyone who shops with him needs to stay consistent. Adding time out is unnecessary when extinction is carried out consistently. (Tolin, pp. 212, 219)",
      "source": ""
    },
    {
      "stem": "A middle school student completes his homework slowly because he wants to play video games. Which plan applies the Premack principle?",
      "options": [
        "\"Once you finish your homework, you can play video games for an hour.\"",
        "\"You'll receive a gold star for every day you finish your homework quickly.\"",
        "\"You lose video game time any day you don't finish your homework.\""
      ],
      "answer": 0,
      "why": "The Premack principle involves using a preferred activity (playing video games) as a reward for completing a less-preferred activity (homework): \"you get to do this after you do that.\" Gold stars are a tangible reinforcer, and losing video game time is a penalty. (Refer to Tolin, pp. 210 to 211)",
      "source": ""
    },
    {
      "stem": "A third grader often answers questions before being called on, which prevents other students from having a chance to participate. His teacher wants to reduce this behavior without using punishment. Which response is an example of differential reinforcement of other behavior (DRO)?",
      "options": [
        "Move his desk to the back of the room each time he answers without being called on",
        "Ignore the behavior until it fades on its own",
        "Provide immediate praise each time he waits to be called on before answering"
      ],
      "answer": 2,
      "why": "DRO involves reinforcing the absence of a problematic behavior with immediate feedback. Moving his desk is punishment, and ignoring the behavior alone can cause an extinction burst. Immediate praise helps reinforce waiting to be called on, which is the desired behavior. (Tolin, p. 212)",
      "source": ""
    },
    {
      "stem": "A client who has been working on speaking up for herself starts a session by saying, \"I know we planned to talk about my job today, but my son's school called yesterday and I need to talk about that instead.\" Applying the principle of reinforcing assertiveness as a behavioral intervention in session, which therapist response is BEST?",
      "options": [
        "\"That's wonderful that you spoke up! I'm really proud of how assertive you're being.\"",
        "\"Okay, let's put your son's school first today. What happened?\"",
        "\"Let's stick with our plan for now, and we can get to that next week if there's time.\""
      ],
      "answer": 1,
      "why": "Changing the agenda in response to the client's assertiveness provides a natural reinforcement, showing that speaking up leads to concrete changes in session. Excessive praise, though supportive, does not effectively reinforce assertiveness in a practical sense, and ignoring the request contradicts the behavior we aim to encourage. (Tolin, pp. 228 to 230)",
      "source": ""
    },
    {
      "stem": "A couple reports that most of their exchanges happen by text and are about chores, complaints, and who is late picking up the kids. One partner now stays late at work until the other is asleep. After the therapist points out this pattern, which next step BEST increases positive reinforcement in the relationship?",
      "options": [
        "Teach each partner to ignore the other's complaints so they extinguish",
        "Have the couple stop texting about chores until the tension eases",
        "Ask each partner to express one specific appreciation they have for each other (daily)"
      ],
      "answer": 2,
      "why": "Distressed couples rely on punishment efforts (complaints) and escape (staying late at work) with little positive reinforcement. Increasing specific expressions of gratitude starts a reciprocal positive cycle. Ignoring complaints leaves the cycle in place, and not texting about chores is avoidance that leaves the pattern unchanged. (Tolin, pp. 234 to 236)",
      "source": ""
    },
    {
      "stem": "A widowed man with depression brings in a week of activity logs as part of activity scheduling. Most hours are spent sitting in his recliner, rated 0 to 1 for mastery and pleasure. Tuesday coffee with a neighbor was rated 5 for pleasure, and fixing a leaky faucet was rated 6 for mastery. What should the therapist do NEXT?",
      "options": [
        "Schedule more activities that brought mastery or pleasure, like coffee with the neighbor",
        "Have him keep logging for another month to get a clearer baseline",
        "Encourage him to join a new club or class he has never tried"
      ],
      "answer": 0,
      "why": "Activity scheduling builds on what the log shows. Activities that already bring mastery or pleasure are likely to be naturally reinforcing for this client. More logging delays change, and brand new activities have no track record of being rewarding for him. (Tolin, pp. 251 to 253)",
      "source": ""
    },
    {
      "stem": "A man recovering from depression wants to start looking for work again. Last week he planned to send 20 job applications in one day, sent none, and has not tried since. Which plan BEST reflects graded task assignment?",
      "options": [
        "Set aside a full day next weekend to send as many applications as possible",
        "Hold off on the job search until his mood and energy improve",
        "Update one section of his resume this week, then apply to one or two jobs next week"
      ],
      "answer": 2,
      "why": "Graded task assignment breaks a large task into manageable steps and builds up gradually. A full day of applications repeats the overwhelming plan that already failed, and waiting to feel better first reinforces inactivity. (Tolin, pp. 258 to 260)",
      "source": ""
    },
    {
      "stem": "A client with social anxiety is about to order coffee at a busy café as an exposure activity. Before walking in, he asks, \"Can I read my order off my phone so I don't mess it up?\" Considering the role of safety behaviors in exposure, which response is BEST?",
      "options": [
        "\"Sure, having it ready may help you get through the first few tries.\"",
        "\"Let's put the phone away this time so you can learn you can order without a script.\"",
        "\"Let's wait until your anxiety feels lower before we go in.\""
      ],
      "answer": 1,
      "why": "Safety behaviors teach conditional safety (\"I only got through it because I read off my phone\"). Tolin recommends removing them as soon as possible instead of tapering them. Waiting for anxiety to drop first reinforces avoidance. (Tolin, pp. 279 to 282, 299)",
      "source": ""
    },
    {
      "stem": "A client afraid of elevators rides to the 10th floor with her therapist. Her fear rating goes from 75 to 65. She says, \"I was sure I'd pass out once the doors closed, and I didn't.\" Based on current guidance for ending an exposure, what should the therapist do?",
      "options": [
        "Note the change in her belief and plan the next exposure",
        "Keep riding until her fear rating falls to 35 or below",
        "Return to an easier hierarchy item because her fear did not drop enough"
      ],
      "answer": 0,
      "why": "An exposure can end when there is a cognitive shift, such as a weaker catastrophic belief or a stronger coping belief. The old rule of waiting for fear to drop by half is not supported, and change between sessions predicts outcome better than change within a session. (Tolin, pp. 278 to 279, 296 to 297)",
      "source": ""
    },
    {
      "stem": "A client with panic disorder avoids exercise and climbing stairs because feeling their heart race makes them think they are about to have a heart attack and lose control. Her physician has ruled out medical causes. Which interoceptive exposure exercise is specifically designed for this client?",
      "options": [
        "Imagining a detailed scene of having a heart attack in a public place",
        "Running in place to intentionally increase heart rate",
        "Standing at the top of a staircase"
      ],
      "answer": 1,
      "why": "Interoceptive exposure involves intentionally inducing the feared sensation to decrease the client's anxiety response to it. The correct choice is running in place, as it directly addresses the increased heart rate sensation which the client fears. Simply imagining or facing locations like the top of a staircase does not accurately target the physical sensation. (Tolin, pp. 293 to 294)",
      "source": ""
    },
    {
      "stem": "A client who is extremely self-conscious about how her face looks when blushing has a history of avoiding social gatherings. During exposure therapy, she attends a coworker's party and reports a fear level of only 15 out of 100. She shares that she managed to keep her fear low by wearing a turtleneck, applying heavy makeup, and staying in a dimly lit corner of the room. How might a therapist evaluate her progress in managing her fear based on this information?",
      "options": [
        "Her use of safety behaviors means she is not fully confronting her fears.",
        "Her low fear rating means she no longer needs exposure therapy.",
        "Simply attending the party means she has achieved the goals of therapy."
      ],
      "answer": 0,
      "why": "The therapist would evaluate that the client's use of safety behaviors, such as wearing concealing clothing and staying in dim areas, indicates she is avoiding fully confronting her fear. This prevents the disconfirmation of her anxiety-related beliefs, which is crucial for effective exposure therapy. Simply attending the party with such strategies does not indicate that she is addressing her fear therapeutically. (Tolin, p. 286)",
      "source": ""
    },
    {
      "stem": "A teenager can describe exactly how he would turn down a friend who offers him a vape, but at parties, he goes along with it every time. Which social skills training would BEST address this type of performance deficit?",
      "options": [
        "Spend the next sessions explaining the steps of an effective refusal",
        "Give him a handout on handling peer pressure to review at home",
        "Role play refusals in session and give specific feedback"
      ],
      "answer": 2,
      "why": "This client knows the skill but cannot use it under social pressure, which is a performance deficit. For performance deficits, training relies less on instruction and modeling and more on rehearsal and feedback. Explaining the steps and giving a handout would fit an acquisition deficit, which he does not have. (Tolin, p. 316)",
      "source": ""
    },
    {
      "stem": "A father seeks help in getting his teenage son to school on time. The therapist suggests using problem-solving through brainstorming. The father begins to list ideas, but he immediately dismisses each one, saying, \"He'd never go for that.\" Applying the critical aspects of brainstorming, which therapist response is BEST?",
      "options": [
        "\"Let's write down every idea for now, even the unlikely ones, and judge them later.\"",
        "\"You're right. Let's focus on the one idea most likely to work.\"",
        "\"Let's go back and define the problem more clearly first.\""
      ],
      "answer": 0,
      "why": "Brainstorming works best when the client holds off on judging and aims for quantity, since the first ideas are often not the best ones. Weighing pros and cons comes after the list is built. The problem is already defined, so going back to that step is unnecessary. (Tolin, p. 322)",
      "source": ""
    }
  ];

  var LETTERS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

  var quiz       = document.getElementById('quiz');
  var counter    = document.getElementById('counter');
  var meterFill  = document.getElementById('meterFill');
  var scoreLive  = document.getElementById('scoreLive');
  var result     = document.getElementById('result');
  var finalScore = document.getElementById('finalScore');
  var finalNote  = document.getElementById('finalNote');
  var restart    = document.getElementById('restart');

  var answered = 0, correct = 0;

  function answersOf(q) { return Array.isArray(q.answer) ? q.answer : [q.answer]; }

  function build() {
    quiz.innerHTML = '';
    answered = 0;
    correct = 0;
    result.classList.remove('show');
    updateStatus();

    QUESTIONS.forEach(function (q, qi) {
      var multi = Array.isArray(q.answer);
      var block = document.createElement('section');
      block.className = 'qcard';

      var num = document.createElement('p');
      num.className = 'qnum';
      num.textContent = 'Question ' + (qi + 1);

      var stem = document.createElement('p');
      stem.className = 'stem';
      stem.textContent = q.stem;

      var opts = document.createElement('div');
      opts.className = 'opts';

      var why = document.createElement('div');
      why.className = 'why';
      why.setAttribute('role', 'status');

      q.options.forEach(function (text, oi) {
        var btn = document.createElement('button');
        btn.className = 'opt';
        btn.type = 'button';

        var letter = document.createElement('span');
        letter.className = 'ltr';
        letter.textContent = LETTERS[oi];

        var label = document.createElement('span');
        label.textContent = text;

        btn.appendChild(letter);
        btn.appendChild(label);
        btn.addEventListener('click', function () {
          if (multi) { if (!btn.disabled) btn.classList.toggle('picked'); }
          else choose(q, [oi], opts, why);
        });
        opts.appendChild(btn);
      });

      block.appendChild(num);
      block.appendChild(stem);
      if (multi) {
        var hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = 'Select all that apply, then check.';
        block.appendChild(hint);
      }
      block.appendChild(opts);
      if (multi) {
        var check = document.createElement('button');
        check.className = 'check';
        check.type = 'button';
        check.textContent = 'Check answer';
        check.addEventListener('click', function () {
          var picks = [];
          var buttons = opts.querySelectorAll('.opt');
          for (var i = 0; i < buttons.length; i++) if (buttons[i].classList.contains('picked')) picks.push(i);
          if (!picks.length) return;
          check.disabled = true;
          choose(q, picks, opts, why);
        });
        block.appendChild(check);
      }
      block.appendChild(why);
      quiz.appendChild(block);
    });
  }

  function choose(q, picks, opts, why) {
    var buttons = opts.querySelectorAll('.opt');
    if (buttons[0].disabled) return;

    var answers = answersOf(q);
    var right = picks.length === answers.length && picks.every(function (p) { return answers.indexOf(p) >= 0; });
    answered++;
    if (right) correct++;

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = true;
      buttons[i].classList.remove('picked');
      if (answers.indexOf(i) >= 0)    buttons[i].classList.add('correct');
      else if (picks.indexOf(i) >= 0) buttons[i].classList.add('wrong');
      else                            buttons[i].classList.add('dim');
    }

    var verdict = document.createElement('span');
    verdict.className = 'verdict ' + (right ? 'ok' : 'no');
    var letters = answers.map(function (a) { return LETTERS[a]; });
    verdict.textContent = right ? 'Correct'
      : (letters.length > 1 ? 'The answers are ' + letters.join(' and ') : 'The answer is ' + letters[0]);

    why.className = 'why ' + (right ? 'ok' : 'no');
    why.innerHTML = '';
    why.appendChild(verdict);

    if (q.why) {
      var body = document.createElement('span');
      body.textContent = q.why;
      why.appendChild(body);
    }

    if (q.source) {
      var src = document.createElement('span');
      src.className = 'source';
      var srcLabel = document.createElement('b');
      srcLabel.textContent = 'Where to find it';
      var srcBody = document.createElement('span');
      srcBody.textContent = q.source;
      src.appendChild(srcLabel);
      src.appendChild(srcBody);
      why.appendChild(src);
    }

    why.classList.add('show');

    updateStatus();
    if (answered === QUESTIONS.length) finish();
  }

  function updateStatus() {
    counter.textContent = answered + ' of ' + QUESTIONS.length + ' answered';
    scoreLive.textContent = correct + ' correct';
    meterFill.style.width = (answered / QUESTIONS.length * 100) + '%';
  }

  function finish() {
    finalScore.textContent = correct + ' / ' + QUESTIONS.length;
    var pct = correct / QUESTIONS.length;
    finalNote.textContent = pct === 1
      ? 'All sixteen. Bring your questions to class anyway.'
      : pct >= 0.8
        ? 'Solid. Look back at the ones you missed before class.'
        : pct >= 0.5
          ? 'Worth a second pass through the readings on the items you missed.'
          : 'Read back through the rationales and the cited sections, then take it again.';
    result.classList.add('show');
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  restart.addEventListener('click', function () {
    build();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  build();
})();
</script>
